{% extends "base.html" %}
{% block title %}{{ tool_name }} — Sofia{% endblock %}
{% block content %}
<div class="wrap" style="max-width:860px;padding-bottom:70px">
  <nav class="crumb"><a href="{{ url_for('account.dashboard') }}">Account</a> &rsaquo; {{ tool_name }}</nav>
  <h1 style="font-size:1.7rem;margin-top:18px">{{ tool_name }}</h1>
  <p style="color:var(--ink-3)">Created {{ job.created_at.strftime('%d %B %Y at %H:%M') }}</p>
  <section class="panel">
    <div class="result__body" id="resultbody" data-payload='{{ payload_json }}'></div>
  </section>
  <div style="display:flex;gap:10px">
    <button class="btn btn--ghost btn--sm" type="button" data-copy>Copy text</button>
    <button class="btn btn--ghost btn--sm" type="button" data-download>Download</button>
  </div>
</div>
{% endblock %}
{% block scripts %}<script>window.Sofia && window.Sofia.renderStored();</script>{% endblock %}
