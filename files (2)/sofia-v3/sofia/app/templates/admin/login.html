<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Sofia</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/sofia.css') }}?v={{ asset_version }}">
</head><body>
<div class="narrow" style="padding-top:80px">
  <h1>Sofia admin</h1>
  <p class="narrow__sub">Staff access only. All actions on this panel are logged.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="alert alert--{{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  <form class="formcard" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label class="label" for="email">Email</label>
      <input class="input" id="email" type="email" name="email" required autofocus autocomplete="username">
    </div>
    <div class="field">
      <label class="label" for="password">Password</label>
      <input class="input" id="password" type="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn btn--primary btn--block btn--lg" type="submit">Sign in</button>
  </form>
</div>
</body></html>
