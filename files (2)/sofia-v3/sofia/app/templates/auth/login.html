{% extends "base.html" %}
{% block title %}Log in — Sofia{% endblock %}
{% from "_back.html" import back %}
{% block content %}
<div class="narrow">
  {{ back(url_for('public.home'), 'all tools') }}
  <h1>Welcome back</h1>
  <p class="narrow__sub">Log in to pick up where you left off.</p>
  <form class="formcard" method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url or '' }}">
    <div class="field">
      <label class="label" for="email">Email</label>
      <input class="input" id="email" type="email" name="email" required autocomplete="email" autofocus>
    </div>
    <div class="field">
      <label class="label" for="password">Password</label>
      <input class="input" id="password" type="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn btn--primary btn--block btn--lg" type="submit" style="margin-top:6px">Log in</button>
    <p style="text-align:center;margin:16px 0 0;font-size:.86rem">
      <a href="{{ url_for('auth.forgot') }}">Forgot your password?</a>
    </p>
  </form>
  <p class="formfoot">No account yet? <a href="{{ url_for('auth.signup') }}">Sign up free</a></p>
</div>
{% endblock %}
